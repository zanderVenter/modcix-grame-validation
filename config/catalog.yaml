# Project catalog: config/.env values are substituted into ${VAR} placeholders below.
# This file is committed - it must never contain real credentials or project IDs,
# only ${VAR} references resolved at runtime by src/config.py.

gee_project:
    name: ${GEEPROJECT}
    bucket: ${GCLOUDBUCKET}

planet_account:
    apikey: ${PLANETAPI}

wekeo_account:
    user: ${WEKEOUSER}
    password: ${WEKEOPW}

project_data:
    type: folder
    filepath: ${PROJDIR}
